# main 에 push 하면 타입체크·테스트를 돌리고, 통과하면 Oracle 서버에 SSH 로 접속해 scripts/deploy.sh 를 실행한다.
#
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST         서버 주소 (예: kingtepad.duckdns.org)
#   DEPLOY_USER         SSH 사용자 (ubuntu)
#   DEPLOY_SSH_KEY      배포 전용 개인키. 서버 authorized_keys 에는 command= 로 deploy.sh 만 실행되게 묶는다
#   DEPLOY_KNOWN_HOSTS  `ssh-keyscan -t ed25519 <서버주소>` 출력 (서버 위장 방지)
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 연달아 push 하면 앞 배포가 끝난 뒤 마지막 것만 실행한다
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: SSH 키 준비
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: 서버에서 deploy.sh 실행
        # 서버의 authorized_keys 가 command= 로 deploy.sh 를 강제하므로 원격 명령은 보내지 않는다
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
